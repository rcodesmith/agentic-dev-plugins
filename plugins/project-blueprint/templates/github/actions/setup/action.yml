# Installs the tools the `just` recipes call, at pinned versions. The one place CI's tool
# versions live; the README's Prerequisites list the same versions for developers.
# Each download is checked against its SHA-256 before it is unpacked: these steps run in jobs
# that can hold deploy credentials. Bump a version and its checksum together, taking the
# checksum from that release's checksums file (SHA256SUMS, *_checksums.txt).
name: setup
description: Install the pinned shared tools and the language toolchain

runs:
  using: composite
  steps:
    - name: Shared tools
      shell: bash
      env:
        JUST_VERSION: "1.59.0"
        JUST_SHA256: 409044617b6f06517c1035e55ca38c8c856ff8b650e41bc2aa1ef82d5903a23e
        GITLEAKS_VERSION: "8.30.1"
        GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        ACTIONLINT_VERSION: "1.7.12"
        ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      run: |
        set -euo pipefail
        bin="$HOME/.local/bin"
        tmp="$(mktemp -d)"
        mkdir -p "$bin"
        fetch() { # url sha256 binary
          curl -fsSL -o "$tmp/archive.tar.gz" "$1"
          echo "$2  $tmp/archive.tar.gz" | sha256sum -c --quiet -
          tar -xzf "$tmp/archive.tar.gz" -C "$bin" "$3"
          rm "$tmp/archive.tar.gz"
        }
        fetch "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz" "$JUST_SHA256" just
        fetch "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "$GITLEAKS_SHA256" gitleaks
        fetch "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" "$ACTIONLINT_SHA256" actionlint
        echo "$bin" >> "$GITHUB_PATH"

    # Language toolchain: the steps from the language pack's "CI setup" section go here.
