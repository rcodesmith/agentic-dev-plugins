name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

# A PR keeps only its newest run. Each push to main gets its own group: GitHub keeps one
# pending run per group and drops the rest, and a commit whose check never ran gets no artifact.
concurrency:
  group: check-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # `just secrets` scans history
      - uses: ./.github/actions/setup
      - run: just setup
      - run: just check
      # `check` leaves `build` out to keep the local gate fast; CI still proves it builds.
      - run: just build
      - run: actionlint
