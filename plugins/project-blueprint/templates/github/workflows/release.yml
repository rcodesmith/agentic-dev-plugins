# Libraries only. A vX.Y.Z tag on a commit already on main publishes that version.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  require-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main"
            exit 1
          fi

  check:
    needs: require-main
    uses: ./.github/workflows/check.yml

  publish:
    needs: check
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # trusted publishing (OIDC to the registry); remove if unused
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: just setup
      # CREDENTIALS: a registry login step goes here, if trusted publishing is not used.
      - env:
          VERSION: ${{ github.ref_name }}
          # A publish token the recipe reads, named here when trusted publishing is not used, e.g.:
          # NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: just publish "${VERSION#v}"
